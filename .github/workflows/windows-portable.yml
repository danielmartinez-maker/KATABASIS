name: Windows x64 portable app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install packaging dependencies
        run: pnpm install --frozen-lockfile

      - name: Build portable x64 executable
        run: pnpm run dist:win

      - name: Upload the Windows app
        uses: actions/upload-artifact@v4
        with:
          name: KATABASIS-Windows-x64-portable
          path: dist/KATABASIS-1.0.0-win-x64-portable.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

